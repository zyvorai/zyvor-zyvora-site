<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d"><title id="t">Five steps to try ZYVORA</title><desc id="d">Paste one command, accept the browser's certificate warning once, pick a demo doctor, look around the dashboard, and run the check command.</desc><rect width="1280" height="400" fill="#000000"/><text x="640" y="52" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.8">From paste to dashboard in five steps</text><text x="640" y="84" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">About five minutes. Nothing leaves your computer.</text><rect x="40" y="120" width="224" height="250" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><circle cx="74" cy="156" r="16" fill="#2997ff"/><text x="74" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">1</text><rect x="82" y="198" width="140" height="80" rx="10" fill="#0b0b0c"/><circle cx="96" cy="210" r="3.5" fill="#ff5f57"/><circle cx="108" cy="210" r="3.5" fill="#febc2e"/><circle cx="120" cy="210" r="3.5" fill="#28c840"/><text x="94" y="240" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">$ curl … | sh</text><rect x="94" y="252" width="9" height="15" fill="#30d158"/><text x="152" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Paste one command</text><text x="152" y="346" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">into Terminal or PowerShell</text><rect x="284" y="120" width="224" height="250" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><circle cx="318" cy="156" r="16" fill="#2997ff"/><text x="318" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">2</text><path d="M396 196 L442 272 L350 272 Z" fill="#2b2300" stroke="#ffd60a" stroke-width="4" stroke-linejoin="round"/><rect x="393" y="220" width="6" height="30" rx="3" fill="#ffd60a"/><circle cx="396" cy="260" r="3.5" fill="#ffd60a"/><text x="396" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Accept the warning</text><text x="396" y="346" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">once: the certificate is your own</text><rect x="528" y="120" width="224" height="250" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><circle cx="562" cy="156" r="16" fill="#2997ff"/><text x="562" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">3</text><circle cx="588" cy="238" r="22" fill="#000000" stroke="#2997ff" stroke-width="3"/><text x="588" y="244" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.0">MR</text><circle cx="640" cy="238" r="22" fill="#000000" stroke="#3a3a3c" stroke-width="1.5"/><text x="640" y="244" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.0">IK</text><circle cx="692" cy="238" r="22" fill="#000000" stroke="#3a3a3c" stroke-width="1.5"/><text x="692" y="244" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.0">KI</text><path d="M574 282 l14 -12 l14 12" fill="none" stroke="#2997ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Pick a doctor</text><text x="640" y="346" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">no password in the demo</text><rect x="772" y="120" width="224" height="250" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><circle cx="806" cy="156" r="16" fill="#2997ff"/><text x="806" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">4</text><rect x="810" y="192" width="148" height="92" rx="10" fill="#000000" stroke="#3a3a3c" stroke-width="1.0"/><rect x="818" y="200" width="60" height="26" rx="6" fill="#1d1d1f"/><rect x="886" y="200" width="64" height="26" rx="6" fill="#1d1d1f"/><polyline points="818,268 844,246 866,260 892,236 918,250 950,232" fill="none" stroke="#2997ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="884" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Look around</text><text x="884" y="346" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">invented patients, real screens</text><rect x="1016" y="120" width="224" height="250" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><circle cx="1050" cy="156" r="16" fill="#2997ff"/><text x="1050" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">5</text><circle cx="1128" cy="238" r="44" fill="#30d158" fill-opacity="0.18" stroke="#30d158" stroke-width="4"/><path d="M1108 240 l14 14 l28 -30" fill="none" stroke="#30d158" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="1128" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Check it</text><text x="1128" y="346" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">one command says all passed</text></svg>
