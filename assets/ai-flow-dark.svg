<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 410" width="1280" height="410" role="img" aria-labelledby="t d"><title id="t">How an AI draft is reviewed</title><desc id="d">Draft only. A note or consented transcript goes to a private model after identifiers are removed. The draft quotes its sources. A named clinician accepts, edits or rejects it, and the review is bound to the note revision and recorded on the hash-chained audit trail. Synthetic data only.</desc><rect width="1280" height="410" fill="#000000"/><text x="640" y="52" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.8">The assistant drafts. A named clinician decides.</text><text x="640" y="84" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">Off until an administrator turns it on. On a private server you control. Synthetic data only.</text><rect x="40" y="120" width="224" height="220" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><circle cx="74" cy="156" r="16" fill="#2997ff"/><text x="74" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">1</text><rect x="102" y="190" width="100" height="72" rx="10" fill="#000000" stroke="#3a3a3c" stroke-width="1.0"/><rect x="116" y="204" width="72" height="6" rx="3" fill="#3a3a3c"/><rect x="116" y="220" width="54" height="6" rx="3" fill="#3a3a3c"/><rect x="116" y="236" width="72" height="6" rx="3" fill="#3a3a3c"/><rect x="116" y="252" width="54" height="6" rx="3" fill="#3a3a3c"/><text x="152" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Note or transcript</text><text x="152" y="320" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">With the patient's consent</text><path d="M266 230 l16 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#a1a1a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="120" width="224" height="220" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><circle cx="318" cy="156" r="16" fill="#2997ff"/><text x="318" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">2</text><rect x="350" y="190" width="92" height="28" rx="8" fill="#000000" stroke="#3a3a3c" stroke-width="1.0"/><rect x="350" y="228" width="92" height="28" rx="8" fill="#000000" stroke="#3a3a3c" stroke-width="1.0"/><circle cx="366" cy="204" r="4" fill="#30d158"/><circle cx="366" cy="242" r="4" fill="#30d158"/><text x="396" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Private model</text><text x="396" y="320" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">Identifiers removed first</text><path d="M510 230 l16 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#a1a1a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="528" y="120" width="224" height="220" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><circle cx="562" cy="156" r="16" fill="#2997ff"/><text x="562" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">3</text><rect x="590" y="190" width="100" height="72" rx="10" fill="#000000" stroke="#2997ff" stroke-width="1.0"/><rect x="604" y="204" width="60" height="6" rx="3" fill="#2997ff"/><rect x="604" y="220" width="72" height="6" rx="3" fill="#3a3a3c"/><rect x="604" y="236" width="48" height="6" rx="3" fill="#3a3a3c"/><text x="676" y="209" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2997ff" text-anchor="middle" letter-spacing="0.0">[1]</text><text x="640" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Draft</text><text x="640" y="320" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">Quotes the lines it came from</text><path d="M754 230 l16 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#a1a1a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="772" y="120" width="224" height="220" rx="20" fill="#1d1d1f" stroke="#2997ff" stroke-width="2.5"/><circle cx="806" cy="156" r="16" fill="#2997ff"/><text x="806" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">4</text><circle cx="884" cy="212" r="16" fill="#000000" stroke="#2997ff" stroke-width="3"/><path d="M854 260 q30 -40 60 0" fill="none" stroke="#2997ff" stroke-width="3" stroke-linecap="round"/><circle cx="918" cy="250" r="14" fill="#30d158"/><path d="M911 250 l5 5 l9 -11" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="884" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Named clinician</text><text x="884" y="320" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">Accepts, edits or rejects</text><path d="M998 230 l16 0 m-6 -6 l6 6 l-6 6" fill="none" stroke="#a1a1a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1016" y="120" width="224" height="220" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><circle cx="1050" cy="156" r="16" fill="#2997ff"/><text x="1050" y="162" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.0">5</text><rect x="1066" y="212" width="36" height="28" rx="8" fill="#000000" stroke="#3a3a3c" stroke-width="2"/><rect x="1110" y="212" width="36" height="28" rx="8" fill="#000000" stroke="#3a3a3c" stroke-width="2"/><rect x="1154" y="212" width="36" height="28" rx="8" fill="#000000" stroke="#3a3a3c" stroke-width="2"/><line x1="1102" y1="226" x2="1110" y2="226" stroke="#2997ff" stroke-width="3"/><line x1="1146" y1="226" x2="1154" y2="226" stroke="#2997ff" stroke-width="3"/><text x="1128" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.3">Audit chain</text><text x="1128" y="320" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">Bound to the note revision</text><text x="640" y="384" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">Draft only: no tools, no actions, no generated SQL. No model has been clinically validated.</text></svg>
