<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="t d"><title id="t">Illustration of a draft review</title><desc id="d">An illustration with invented text: a draft assessment and plan, each statement citing note lines, with Accept, Edit and Reject for a named clinician.</desc><rect width="1440" height="900" fill="#ffffff"/><rect x="0" y="0" width="1440" height="900" rx="0" fill="#ffffff"/><rect x="60" y="60" width="1320" height="780" rx="24" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.0"/><text x="100" y="130" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.8">Draft assessment and plan</text><rect x="1000" y="98" width="340" height="44" rx="22" fill="#fff4e0"/><text x="1170" y="127" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff9f0a" text-anchor="middle" letter-spacing="0.0">DRAFT: clinician must review</text><text x="100" y="168" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">Synthetic patient · invented note · illustration, not a screenshot</text><rect x="100" y="210" width="780" height="118" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.0"/><text x="128" y="248" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0071e3" text-anchor="start" letter-spacing="0.5">Subjective</text><text x="128" y="284" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#1d1d1f" text-anchor="start" letter-spacing="0.0">Cough for three days, worse at night. No fever reported.</text><text x="128" y="312" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">Source: note line 2</text><rect x="100" y="344" width="780" height="118" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.0"/><text x="128" y="382" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0071e3" text-anchor="start" letter-spacing="0.5">Objective</text><text x="128" y="418" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#1d1d1f" text-anchor="start" letter-spacing="0.0">Temperature 36.8 °C. Chest clear on auscultation.</text><text x="128" y="446" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">Source: note lines 5-6</text><rect x="100" y="478" width="780" height="118" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.0"/><text x="128" y="516" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0071e3" text-anchor="start" letter-spacing="0.5">Assessment</text><text x="128" y="552" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#1d1d1f" text-anchor="start" letter-spacing="0.0">Consider a viral upper respiratory infection.</text><text x="128" y="580" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">Source: note lines 2, 6</text><rect x="100" y="612" width="780" height="118" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.0"/><text x="128" y="650" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0071e3" text-anchor="start" letter-spacing="0.5">Plan</text><text x="128" y="686" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#1d1d1f" text-anchor="start" letter-spacing="0.0">Fluids and rest. Review in one week if not improving.</text><text x="128" y="714" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">Source: note line 8</text><rect x="920" y="210" width="420" height="524" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.0"/><text x="950" y="252" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.4">Review</text><text x="950" y="288" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">Reviewer: a named clinician</text><text x="950" y="312" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">Bound to note revision 3</text><rect x="950" y="352" width="360" height="50" rx="25" fill="#0071e3" stroke="#0071e3" stroke-width="1.0"/><text x="1130" y="384" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.0">Accept</text><rect x="950" y="418" width="360" height="50" rx="25" fill="#ffffff" stroke="#0071e3" stroke-width="1.0"/><text x="1130" y="450" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#0071e3" text-anchor="middle" letter-spacing="0.0">Edit</text><rect x="950" y="484" width="360" height="50" rx="25" fill="#ffffff" stroke="#0071e3" stroke-width="1.0"/><text x="1130" y="516" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#0071e3" text-anchor="middle" letter-spacing="0.0">Reject</text><text x="950" y="590" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">Nothing joins the record until a</text><text x="950" y="612" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">named clinician has reviewed it.</text><text x="950" y="660" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0.0">Recorded on the audit chain.</text><text x="720" y="806" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#6e6e73" text-anchor="middle" letter-spacing="1.2">ILLUSTRATION · SYNTHETIC DATA · NOT A SCREENSHOT OF THE PRODUCT</text></svg>
