<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 112 1280 368" width="1280" height="368" role="img" aria-labelledby="t d">
<title id="t">Deployment options</title><desc id="d">Docker Compose, a Helm chart, and a k3s deployment with Keycloak and Envoy Gateway, all running the same two images.</desc>
<defs></defs>
<rect x="0" y="0" width="1280" height="480" rx="0" fill="#ffffff"/>
<text x="640" y="62" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1">Run it your way</text><text x="640" y="96" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6e6e73" text-anchor="middle">The same two images everywhere: zyvora-api and zyvora-web.</text><rect x="40" y="130" width="380" height="292" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><text x="68" y="186" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">Docker Compose</text><text x="68" y="214" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73">One host, demos, small clinics</text><circle cx="74" cy="255" r="4" fill="#34c759"/><text x="90" y="260" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">API + web + PostgreSQL</text><circle cx="74" cy="291" r="4" fill="#34c759"/><text x="90" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">Optional Envoy edge, TLS</text><circle cx="74" cy="327" r="4" fill="#34c759"/><text x="90" y="332" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">Built and run in a FluxVM VM</text><rect x="68" y="368" width="197.2" height="28" rx="14" fill="#ffffff" stroke="#34c759"/><text x="166.6" y="387" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#34c759" text-anchor="middle">run and tested in a VM</text><rect x="450" y="130" width="380" height="292" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><text x="478" y="186" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">Helm chart</text><text x="478" y="214" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73">Kubernetes</text><circle cx="484" cy="255" r="4" fill="#34c759"/><text x="500" y="260" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">Network policies, PDB, HPA</text><circle cx="484" cy="291" r="4" fill="#34c759"/><text x="500" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">CloudNativePG database option</text><circle cx="484" cy="327" r="4" fill="#34c759"/><text x="500" y="332" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">Lint and kubeconform clean</text><rect x="478" y="368" width="151.6" height="28" rx="14" fill="#ffffff" stroke="#34c759"/><text x="553.8" y="387" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#34c759" text-anchor="middle">installed on k3s</text><rect x="860" y="130" width="380" height="292" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><text x="888" y="186" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">k3s with identity</text><text x="888" y="214" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73">Keycloak + Envoy Gateway</text><circle cx="894" cy="255" r="4" fill="#34c759"/><text x="910" y="260" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">Haven's Keycloak, themed sign-in</text><circle cx="894" cy="291" r="4" fill="#34c759"/><text x="910" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">Gateway edge, session check</text><circle cx="894" cy="327" r="4" fill="#34c759"/><text x="910" y="332" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#1d1d1f">Browser-tested end to end</text><rect x="888" y="368" width="136.4" height="28" rx="14" fill="#ffffff" stroke="#34c759"/><text x="956.2" y="387" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#34c759" text-anchor="middle">browser-tested</text><text x="640" y="452" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="middle">Single-node demo certificate is self-signed; no load testing yet. Details and limits: docs/K3S.md.</text>
</svg>
