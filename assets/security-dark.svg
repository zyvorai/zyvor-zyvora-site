<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
<title id="t">ZYVORA security controls</title><desc id="d">Six controls: forced row-level security on every tenant-owned table, thirteen roles, 30-minute idle sessions, OIDC with PKCE, an append-only audit chain, and CSRF protection.</desc>
<defs></defs>
<rect x="0" y="0" width="1280" height="460" rx="0" fill="#000000"/>
<text x="640" y="62" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-1">Built to be trusted with patient records</text><text x="640" y="96" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#a1a1a6" text-anchor="middle">Not yet certified or independently pen-tested; see the honest limits in the docs.</text><rect x="40" y="128" width="380" height="128" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><text x="66" y="186" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#30d158" letter-spacing="-1">RLS</text><text x="66" y="214" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f5f5f7">forced on every tenant-owned table</text><text x="66" y="238" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a1a1a6">The database, not just the app, keeps tenants apart.</text><rect x="450" y="128" width="380" height="128" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><text x="476" y="186" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#2997ff" letter-spacing="-1">13</text><text x="476" y="214" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f5f5f7">roles, deny by default</text><text x="476" y="238" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a1a1a6">Every call is authorised and facility-scoped.</text><rect x="860" y="128" width="380" height="128" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><text x="886" y="186" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#64d2ff" letter-spacing="-1">30 min</text><text x="886" y="214" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f5f5f7">idle session, 8 h at most</text><text x="886" y="238" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a1a1a6">Server-side sessions, token stored hashed.</text><rect x="40" y="278" width="380" height="128" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><text x="66" y="336" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#bf5af2" letter-spacing="-1">PKCE</text><text x="66" y="364" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f5f5f7">OIDC sign-in, no passwords</text><text x="66" y="388" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a1a1a6">ZYVORA never sees a password.</text><rect x="450" y="278" width="380" height="128" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><text x="476" y="336" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#ff9f0a" letter-spacing="-1">Chain</text><text x="476" y="364" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f5f5f7">append-only audit trail</text><text x="476" y="388" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a1a1a6">Written in the same transaction; verifiable.</text><rect x="860" y="278" width="380" height="128" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><text x="886" y="336" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#f5f5f7" letter-spacing="-1">CSRF</text><text x="886" y="364" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#f5f5f7">double-submit on every change</text><text x="886" y="388" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#a1a1a6">Plus CSP, rate limits and security headers.</text>
</svg>
