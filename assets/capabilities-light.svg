<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 112 1280 358" width="1280" height="358" role="img" aria-labelledby="t d">
<title id="t">What ZYVORA covers</title><desc id="d">Five groups: clinical, hospital, business, governance, and AI with review, each with four capabilities.</desc>
<defs></defs>
<rect x="0" y="0" width="1280" height="470" rx="0" fill="#ffffff"/>
<text x="640" y="62" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1">One platform. Every part of the day.</text><text x="640" y="96" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6e6e73" text-anchor="middle">Twelve modules for clinicians, administrators and patients.</text><rect x="26" y="130" width="236" height="296" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><rect x="50" y="158" width="36" height="6" rx="3" fill="#0071e3"/><text x="50" y="208" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">Clinical</text><circle cx="56" cy="253" r="4" fill="#0071e3"/><text x="70" y="258" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Patient registry</text><circle cx="56" cy="293" r="4" fill="#0071e3"/><text x="70" y="298" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Appointments, queue</text><circle cx="56" cy="333" r="4" fill="#0071e3"/><text x="70" y="338" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">SOAP notes, signed</text><circle cx="56" cy="373" r="4" fill="#0071e3"/><text x="70" y="378" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Prescribing</text><rect x="274" y="130" width="236" height="296" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><rect x="298" y="158" width="36" height="6" rx="3" fill="#34c759"/><text x="298" y="208" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">Hospital</text><circle cx="304" cy="253" r="4" fill="#34c759"/><text x="318" y="258" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Emergency board, triage</text><circle cx="304" cy="293" r="4" fill="#34c759"/><text x="318" y="298" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Wards, beds, admits</text><circle cx="304" cy="333" r="4" fill="#34c759"/><text x="318" y="338" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Lab, critical results</text><circle cx="304" cy="373" r="4" fill="#34c759"/><text x="318" y="378" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Imaging and pharmacy</text><rect x="522" y="130" width="236" height="296" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><rect x="546" y="158" width="36" height="6" rx="3" fill="#ff9f0a"/><text x="546" y="208" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">Business</text><circle cx="552" cy="253" r="4" fill="#ff9f0a"/><text x="566" y="258" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Billing and invoices</text><circle cx="552" cy="293" r="4" fill="#ff9f0a"/><text x="566" y="298" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Insurance claims</text><circle cx="552" cy="333" r="4" fill="#ff9f0a"/><text x="566" y="338" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Insights, 11 metrics</text><circle cx="552" cy="373" r="4" fill="#ff9f0a"/><text x="566" y="378" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Facility setup</text><rect x="770" y="130" width="236" height="296" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><rect x="794" y="158" width="36" height="6" rx="3" fill="#af52de"/><text x="794" y="208" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">Governance</text><circle cx="800" cy="253" r="4" fill="#af52de"/><text x="814" y="258" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">9 roles, deny by default</text><circle cx="800" cy="293" r="4" fill="#af52de"/><text x="814" y="298" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Hash-chained audit trail</text><circle cx="800" cy="333" r="4" fill="#af52de"/><text x="814" y="338" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Break-glass access</text><circle cx="800" cy="373" r="4" fill="#af52de"/><text x="814" y="378" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Row-level isolation</text><rect x="1018" y="130" width="236" height="296" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><rect x="1042" y="158" width="36" height="6" rx="3" fill="#32ade6"/><text x="1042" y="208" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">AI, with review</text><circle cx="1048" cy="253" r="4" fill="#32ade6"/><text x="1062" y="258" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Off unless enabled</text><circle cx="1048" cy="293" r="4" fill="#32ade6"/><text x="1062" y="298" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">Drafts only, no actions</text><circle cx="1048" cy="333" r="4" fill="#32ade6"/><text x="1062" y="338" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">A named person signs</text><circle cx="1048" cy="373" r="4" fill="#32ade6"/><text x="1062" y="378" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#1d1d1f">No SQL, no tool calls</text>
</svg>
