<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="t d"><title id="t">The browser's certificate warning and what to click</title><desc id="d">A browser window showing a warning that the connection is not private, with an arrow to Advanced and then to Proceed. Wording differs by browser.</desc><rect width="880" height="520" fill="#000000"/><rect x="30" y="40" width="820" height="440" rx="16" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><rect x="30" y="40" width="820" height="46" rx="16" fill="#3a3a3c"/><rect x="30" y="66" width="820" height="20" rx="0" fill="#3a3a3c"/><circle cx="56" cy="63" r="6" fill="#ff5f57"/><circle cx="78" cy="63" r="6" fill="#febc2e"/><circle cx="100" cy="63" r="6" fill="#28c840"/><rect x="130" y="50" width="440" height="26" rx="13" fill="#000000"/><text x="150" y="69" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">https://localhost</text><path d="M440 150 L488 232 L392 232 Z" fill="#2b2300" stroke="#ffd60a" stroke-width="5" stroke-linejoin="round"/><rect x="436" y="174" width="8" height="32" rx="4" fill="#ffd60a"/><circle cx="440" cy="220" r="4.5" fill="#ffd60a"/><text x="440" y="290" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.6">Your connection is not private</text><text x="440" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">This computer made its own security certificate, so the browser cannot vouch for it.</text><rect x="330" y="358" width="220" height="46" rx="23" fill="#000000" stroke="#2997ff" stroke-width="2.5"/><text x="440" y="387" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#2997ff" text-anchor="middle" letter-spacing="0.0">Advanced</text><path d="M330 381 L286 381" stroke="#2997ff" stroke-width="3" stroke-linecap="round"/><path d="M296 371 L284 381 L296 391" fill="none" stroke="#2997ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="268" y="388" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#2997ff" text-anchor="end" letter-spacing="0.0">1. Click this</text><text x="440" y="438" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">Proceed to localhost (unsafe)</text><line x1="326" y1="443" x2="554" y2="443" stroke="#a1a1a6" stroke-width="1"/><path d="M640 438 L590 438" stroke="#30d158" stroke-width="3" stroke-linecap="round"/><path d="M602 428 L590 438 L602 448" fill="none" stroke="#30d158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="656" y="444" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#30d158" text-anchor="start" letter-spacing="0.0">2. Then this</text><text x="440" y="510" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">Illustration: your browser's wording differs a little</text></svg>
