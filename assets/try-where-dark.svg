<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d"><title id="t">How to open a terminal on Mac, Windows and Linux</title><desc id="d">On a Mac press Command and Space and type Terminal. On Windows press the Windows key and type PowerShell. On Linux press Control, Alt and T.</desc><rect width="1280" height="400" fill="#000000"/><text x="640" y="52" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.8">Where do I paste it?</text><text x="640" y="84" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">Any terminal works. These are the quickest ways to open one.</text><rect x="40" y="120" width="380" height="250" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="68" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5">Mac</text><text x="68" y="200" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Open Terminal</text><rect x="68" y="228" width="52" height="46" rx="10" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1.5"/><text x="94.0" y="259" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.0">⌘</text><rect x="132" y="228" width="108" height="46" rx="10" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1.5"/><text x="186.0" y="259" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.0">Space</text><text x="68" y="316" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Press Command and Space,</text><text x="68" y="338" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">type Terminal, press Return.</text><rect x="450" y="120" width="380" height="250" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="478" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5">Windows</text><text x="478" y="200" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Open PowerShell</text><rect x="478" y="228" width="52" height="46" rx="10" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1.5"/><text x="504.0" y="259" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.0">⊞</text><text x="478" y="316" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Press the Windows key,</text><text x="478" y="338" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">type PowerShell, press Enter.</text><rect x="860" y="120" width="380" height="250" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="888" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5">Linux</text><text x="888" y="200" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Open Terminal</text><rect x="888" y="228" width="94" height="46" rx="10" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1.5"/><text x="935.0" y="259" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.0">Ctrl</text><rect x="994" y="228" width="80" height="46" rx="10" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1.5"/><text x="1034.0" y="259" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.0">Alt</text><rect x="1086" y="228" width="52" height="46" rx="10" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1.5"/><text x="1112.0" y="259" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.0">T</text><text x="888" y="316" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Press Ctrl, Alt and T together,</text><text x="888" y="338" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">or open Terminal from your apps.</text></svg>
