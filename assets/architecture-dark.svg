<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 92 1280 448" width="1280" height="448" role="img" aria-labelledby="t d">
<title id="t">ZYVORA architecture</title><desc id="d">Browser to Envoy edge to nginx to the Rust API and PostgreSQL with row-level security; the API connects to Keycloak for sign-in, an audit trail, optional AI on a private network, and read-only FHIR.</desc>
<defs><marker id="ar" view-box="0 0 10 10" ref-x="8" ref-y="5" marker-width="7" marker-height="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#a1a1a6"/></marker></defs>
<rect x="0" y="0" width="1280" height="540" rx="0" fill="#000000"/>
<text x="640" y="56" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-1">How it fits together</text><rect x="48" y="110" width="208" height="100" rx="18" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><rect x="66" y="128" width="28" height="5" rx="2.5" fill="#2997ff"/><text x="66" y="164" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f5f7">Browser</text><text x="66" y="188" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6">React PWA</text><rect x="292" y="110" width="208" height="100" rx="18" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><rect x="310" y="128" width="28" height="5" rx="2.5" fill="#64d2ff"/><text x="310" y="164" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f5f7">Edge</text><text x="310" y="188" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6">TLS, session check</text><rect x="536" y="110" width="208" height="100" rx="18" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><rect x="554" y="128" width="28" height="5" rx="2.5" fill="#64d2ff"/><text x="554" y="164" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f5f7">Web</text><text x="554" y="188" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6">Static app, CSP</text><rect x="780" y="110" width="208" height="100" rx="18" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><rect x="798" y="128" width="28" height="5" rx="2.5" fill="#2997ff"/><text x="798" y="164" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f5f7">API</text><text x="798" y="188" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6">Axum, checks every call</text><rect x="1024" y="110" width="208" height="100" rx="18" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><rect x="1042" y="128" width="28" height="5" rx="2.5" fill="#30d158"/><text x="1042" y="164" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f5f7">PostgreSQL</text><text x="1042" y="188" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6">Row-level security</text><path d="M259 160H286" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M503 160H530" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M747 160H774" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M991 160H1018" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M884 213V268" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M396 268H1128" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M396 268V344" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="292" y="350" width="208" height="100" rx="18" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><rect x="310" y="368" width="28" height="5" rx="2.5" fill="#bf5af2"/><text x="310" y="404" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f5f7">Identity</text><text x="310" y="428" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6">Keycloak, OIDC + PKCE</text><path d="M640 268V344" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="536" y="350" width="208" height="100" rx="18" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><rect x="554" y="368" width="28" height="5" rx="2.5" fill="#bf5af2"/><text x="554" y="404" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f5f7">Audit</text><text x="554" y="428" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6">Hash-chained trail</text><path d="M884 268V344" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="780" y="350" width="208" height="100" rx="18" fill="#1d1d1f" stroke="#a1a1a6" stroke-dasharray="6 6" stroke-width="1.5"/><rect x="798" y="368" width="28" height="5" rx="2.5" fill="#ff9f0a"/><text x="798" y="404" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f5f7">AI assist</text><text x="798" y="428" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6">Optional, private only</text><path d="M1128 268V344" stroke="#a1a1a6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="1024" y="350" width="208" height="100" rx="18" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1"/><rect x="1042" y="368" width="28" height="5" rx="2.5" fill="#30d158"/><text x="1042" y="404" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f5f5f7">Standards</text><text x="1042" y="428" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1a6">FHIR R4 read-only</text><text x="48" y="406" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6">The API is the only</text><text x="48" y="428" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6">door to the data.</text><text x="640" y="500" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="middle">AI is off by default and only drafts; a named person reviews and signs. FHIR is read-only today.</text>
</svg>
