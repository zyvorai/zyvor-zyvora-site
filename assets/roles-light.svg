<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Roles</title><desc id="d">Seventeen roles: doctor, nurse, receptionist, lab technician, pharmacist, radiologist, sterile technician, discharge coordinator, theatre coordinator, records officer, housekeeper, integration operator, auditor, hospital admin, platform admin, corporate contact, patient, each limited to its own work, deny by default.</desc>
<defs></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff"/>
<text x="640" y="62" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1">Seventeen roles, deny by default</text><text x="640" y="96" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#636366" text-anchor="middle">A request is allowed only if one of the caller's roles lists the permission.</text><rect x="32" y="118" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="56" cy="152" r="6" fill="#0071e3"/><text x="74" y="158" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Doctor</text><text x="56" y="184" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Notes, orders,</text><text x="56" y="204" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">prescribing, signing,</text><text x="56" y="224" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">discharge</text><rect x="278" y="118" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="302" cy="152" r="6" fill="#0071e3"/><text x="320" y="158" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Nurse</text><text x="302" y="184" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Triage, vitals, beds,</text><text x="302" y="204" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">collection; cannot sign</text><rect x="524" y="118" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="548" cy="152" r="6" fill="#ff9f0a"/><text x="566" y="158" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Receptionist</text><text x="548" y="184" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Registration, scheduling,</text><text x="548" y="204" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">billing; no clinical</text><text x="548" y="224" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">records</text><rect x="770" y="118" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="794" cy="152" r="6" fill="#32ade6"/><text x="812" y="158" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Lab technician</text><text x="794" y="184" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Collects, results,</text><text x="794" y="204" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">verifies (another person</text><text x="794" y="224" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">verifies)</text><rect x="1016" y="118" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="1040" cy="152" r="6" fill="#32ade6"/><text x="1058" y="158" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Pharmacist</text><text x="1040" y="184" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Dispenses approved</text><text x="1040" y="204" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">prescriptions, manages</text><text x="1040" y="224" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">stock</text><rect x="32" y="256" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="56" cy="290" r="6" fill="#32ade6"/><text x="74" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Radiologist</text><text x="56" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Performs studies, writes</text><text x="56" y="342" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">and addends reports</text><rect x="278" y="256" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="302" cy="290" r="6" fill="#32ade6"/><text x="320" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Sterile technician</text><text x="302" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Sterilises instrument</text><text x="302" y="342" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">sets, reads indicators,</text><text x="302" y="362" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">releases loads</text><rect x="524" y="256" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="548" cy="290" r="6" fill="#ff9f0a"/><text x="566" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Discharge coordinator</text><text x="548" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Discharge tasks and</text><text x="548" y="342" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">boards; no signing or</text><text x="548" y="362" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">money</text><rect x="770" y="256" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="794" cy="290" r="6" fill="#ff9f0a"/><text x="812" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Theatre coordinator</text><text x="794" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Theatre schedule and</text><text x="794" y="342" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">readiness; no clinical</text><text x="794" y="362" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">records</text><rect x="1016" y="256" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="1040" cy="290" r="6" fill="#ff9f0a"/><text x="1058" y="296" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Records officer</text><text x="1040" y="322" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Folder ledger, coding and</text><text x="1040" y="342" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">sign-off, copy requests</text><rect x="32" y="394" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="56" cy="428" r="6" fill="#ff9f0a"/><text x="74" y="434" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Housekeeper</text><text x="56" y="460" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Bed cleaning list only;</text><text x="56" y="480" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">never a patient</text><rect x="278" y="394" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="302" cy="428" r="6" fill="#af52de"/><text x="320" y="434" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Integration operator</text><text x="302" y="460" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Connectors, mappings,</text><text x="302" y="480" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">keys, webhooks; no</text><text x="302" y="500" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">clinical content</text><rect x="524" y="394" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="548" cy="428" r="6" fill="#af52de"/><text x="566" y="434" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Auditor</text><text x="548" y="460" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Reads the audit trail and</text><text x="548" y="480" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">dashboards, nothing else</text><rect x="770" y="394" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="794" cy="428" r="6" fill="#af52de"/><text x="812" y="434" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Hospital admin</text><text x="794" y="460" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Facilities, catalogues,</text><text x="794" y="480" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">refunds, audit; no</text><text x="794" y="500" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">clinical content</text><rect x="1016" y="394" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="1040" cy="428" r="6" fill="#af52de"/><text x="1058" y="434" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Platform admin</text><text x="1040" y="460" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Creates organisations; no</text><text x="1040" y="480" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">clinical access</text><rect x="32" y="532" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="56" cy="566" r="6" fill="#34c759"/><text x="74" y="572" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Corporate contact</text><text x="56" y="598" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">An employer's own roster</text><text x="56" y="618" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">and account; no patient</text><text x="56" y="638" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">records</text><rect x="278" y="532" width="232" height="126" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="302" cy="566" r="6" fill="#34c759"/><text x="320" y="572" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Patient</text><text x="302" y="598" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">Portal only: own</text><text x="302" y="618" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">appointments, medicines,</text><text x="302" y="638" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366">released results</text><text x="640" y="702" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366" text-anchor="middle">Facility scoping applies on top. Full matrix: docs/PERMISSIONS.md.</text>
