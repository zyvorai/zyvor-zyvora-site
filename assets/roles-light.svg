<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Roles</title><desc id="d">Thirteen roles: doctor, nurse, receptionist, lab technician, pharmacist, radiologist, discharge coordinator, theatre coordinator, integration operator, auditor, hospital admin, patient and platform admin, each limited to its own work.</desc>
<defs></defs>
<rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff"/>
<text x="640" y="62" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1">Thirteen roles, deny by default</text><text x="640" y="96" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#636366" text-anchor="middle">A request is allowed only if one of the caller's roles lists the permission.</text><rect x="30" y="126" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="54" cy="160" r="6" fill="#0071e3"/><text x="72" y="166" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Doctor</text><text x="54" y="196" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Notes, orders, prescribing,</text><text x="54" y="218" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">signing, discharge</text><rect x="340" y="126" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="364" cy="160" r="6" fill="#0071e3"/><text x="382" y="166" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Nurse</text><text x="364" y="196" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Triage, vitals, beds,</text><text x="364" y="218" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">collection; cannot sign or</text><text x="364" y="240" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">prescribe</text><rect x="650" y="126" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="674" cy="160" r="6" fill="#ff9f0a"/><text x="692" y="166" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Receptionist</text><text x="674" y="196" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Registration, scheduling,</text><text x="674" y="218" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">billing; no clinical records</text><rect x="960" y="126" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="984" cy="160" r="6" fill="#32ade6"/><text x="1002" y="166" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Lab technician</text><text x="984" y="196" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Collects, results, verifies (a</text><text x="984" y="218" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">different person verifies)</text><rect x="30" y="272" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="54" cy="306" r="6" fill="#32ade6"/><text x="72" y="312" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Pharmacist</text><text x="54" y="342" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Dispenses approved</text><text x="54" y="364" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">prescriptions, manages stock</text><rect x="340" y="272" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="364" cy="306" r="6" fill="#32ade6"/><text x="382" y="312" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Radiologist</text><text x="364" y="342" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Performs studies, writes and</text><text x="364" y="364" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">addends reports</text><rect x="650" y="272" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="674" cy="306" r="6" fill="#ff9f0a"/><text x="692" y="312" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Discharge coordinator</text><text x="674" y="342" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Discharge tasks and boards; no</text><text x="674" y="364" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">signing, results or money</text><rect x="960" y="272" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="984" cy="306" r="6" fill="#ff9f0a"/><text x="1002" y="312" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Theatre coordinator</text><text x="984" y="342" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Theatre schedule and readiness;</text><text x="984" y="364" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">no clinical records</text><rect x="30" y="418" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="54" cy="452" r="6" fill="#af52de"/><text x="72" y="458" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Integration operator</text><text x="54" y="488" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Connectors, mappings, keys,</text><text x="54" y="510" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">webhooks, jobs; no clinical</text><text x="54" y="532" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">content</text><rect x="340" y="418" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="364" cy="452" r="6" fill="#af52de"/><text x="382" y="458" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Auditor</text><text x="364" y="488" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Reads the audit trail and</text><text x="364" y="510" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">dashboards, nothing else</text><rect x="650" y="418" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="674" cy="452" r="6" fill="#af52de"/><text x="692" y="458" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Hospital admin</text><text x="674" y="488" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Facilities, catalogues,</text><text x="674" y="510" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">refunds, audit; cannot read</text><text x="674" y="532" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">clinical content</text><rect x="960" y="418" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="984" cy="452" r="6" fill="#34c759"/><text x="1002" y="458" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Patient</text><text x="984" y="488" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Portal only: own appointments,</text><text x="984" y="510" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">medicines, released results</text><rect x="30" y="564" width="290" height="132" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="54" cy="598" r="6" fill="#af52de"/><text x="72" y="604" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" letter-spacing="-0.3">Platform admin</text><text x="54" y="634" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">Creates organisations; no</text><text x="54" y="656" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#636366">clinical access</text><text x="640" y="702" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#636366" text-anchor="middle">Facility scoping applies on top. Full matrix: docs/PERMISSIONS.md.</text>
</svg>
