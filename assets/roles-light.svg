<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 112 1280 488" width="1280" height="488" role="img" aria-labelledby="t d">
<title id="t">Roles</title><desc id="d">Nine roles: doctor, nurse, receptionist, lab technician, pharmacist, radiologist, hospital admin, patient and platform admin, each limited to its own work.</desc>
<defs></defs>
<rect x="0" y="0" width="1280" height="600" rx="0" fill="#ffffff"/>
<text x="640" y="62" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1">Nine roles, deny by default</text><text x="640" y="96" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6e6e73" text-anchor="middle">A request is allowed only if one of the caller's roles lists the permission.</text><rect x="40" y="130" width="380" height="130" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="70" cy="170" r="6" fill="#0071e3"/><text x="88" y="177" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Doctor</text><text x="70" y="210" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">Notes, orders, prescribing, signing,</text><text x="70" y="234" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">discharge</text><rect x="450" y="130" width="380" height="130" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="480" cy="170" r="6" fill="#0071e3"/><text x="498" y="177" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Nurse</text><text x="480" y="210" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">Triage, vitals, beds; cannot sign or</text><text x="480" y="234" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">prescribe</text><rect x="860" y="130" width="380" height="130" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="890" cy="170" r="6" fill="#ff9f0a"/><text x="908" y="177" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Receptionist</text><text x="890" y="210" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">Registration, scheduling, billing; no</text><text x="890" y="234" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">clinical records</text><rect x="40" y="280" width="380" height="130" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="70" cy="320" r="6" fill="#32ade6"/><text x="88" y="327" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Lab technician</text><text x="70" y="360" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">Collects, results, verifies (a different</text><text x="70" y="384" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">person verifies)</text><rect x="450" y="280" width="380" height="130" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="480" cy="320" r="6" fill="#32ade6"/><text x="498" y="327" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Pharmacist</text><text x="480" y="360" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">Dispenses approved prescriptions, manages</text><text x="480" y="384" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">stock</text><rect x="860" y="280" width="380" height="130" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="890" cy="320" r="6" fill="#32ade6"/><text x="908" y="327" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Radiologist</text><text x="890" y="360" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">Performs studies, writes and addends reports</text><rect x="40" y="430" width="380" height="130" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="70" cy="470" r="6" fill="#af52de"/><text x="88" y="477" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Hospital admin</text><text x="70" y="510" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">Facilities, catalogues, refunds, audit;</text><text x="70" y="534" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">cannot read clinical content</text><rect x="450" y="430" width="380" height="130" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="480" cy="470" r="6" fill="#34c759"/><text x="498" y="477" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Patient</text><text x="480" y="510" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">Portal only: own appointments, medicines,</text><text x="480" y="534" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">released results</text><rect x="860" y="430" width="380" height="130" rx="20" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><circle cx="890" cy="470" r="6" fill="#af52de"/><text x="908" y="477" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Platform admin</text><text x="890" y="510" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">Creates organisations; no clinical access</text><text x="640" y="582" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="middle">Facility scoping applies on top. Full matrix: docs/PERMISSIONS.md.</text>
</svg>
